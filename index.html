<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quackers</title>
<meta name="description" content="Quackers: explore the worlds, find the hidden ducks and fill your Duck Log.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: two screens. Home shows the three world cards. Play shows a top bar, the scene with edge arrows and a corner map, a tool row, then the Duck Log. One bright toy look on a night-blue frame. */
:root{
  --frame:#141d40; --panel:#1f2b5e; --panel2:#2a3876; --line:#36478e;
  --ink:#f4f6ff; --muted:#aab4e6;
  --duck:#ffd43b; --duck-dk:#c99a00; --beak:#ff8a1f; --go:#4cd2a0; --go-dk:#1f8f68;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--frame);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:max(12px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* Top bar */
.top{display:flex;align-items:center;gap:10px}
.where{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.where small{color:var(--muted);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.where b{font-family:var(--display);font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-weight:800;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.25);background:var(--duck);color:#2a1d00}}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.icon-btn svg{width:20px;height:20px}

/* Home */
.hero{text-align:center;padding-block:18px 6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,5rem);line-height:.9;margin:0;color:var(--duck);text-shadow:0 5px 0 var(--duck-dk)}
.hero p{color:var(--muted);margin:10px auto 0;max-width:32ch}
.hero svg{width:110px;height:80px;margin-bottom:4px}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wcard{position:relative;text-align:left;border:3px solid var(--line);border-radius:18px;background:var(--panel);padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.wcard:not(:disabled):hover{border-color:var(--duck)}
.wcard:disabled{cursor:not-allowed;opacity:.6}
.wcard .art{height:84px;display:block;width:100%}
.wcard .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.wcard .info small{color:var(--muted);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.wcard .info b{font-family:var(--display);font-size:1.3rem;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--frame);overflow:hidden}
.bar i{display:block;height:100%;background:var(--duck);border-radius:99px}
.wcard .status{font-size:.85rem;color:var(--muted);font-weight:700}
.wcard .badge{position:absolute;top:8px;right:8px;background:var(--go);color:#062b1d;font-weight:800;font-size:.75rem;border-radius:99px;padding:2px 8px}
.home-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}

/* Stage */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid var(--line);background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0}
.layer svg{display:block;width:100%;height:100%}
.duck,.act,.door{cursor:pointer;outline:none}
.door:hover .dr,.door:focus-visible .dr{filter:brightness(1.35)}
.act:hover,.act:focus-visible{filter:brightness(1.2)}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.45}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-4px)}}
.arrow{position:absolute;width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:rgba(20,29,64,.7);color:#fff;
  display:grid;place-items:center;cursor:pointer;padding:0;z-index:3;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s, background .12s}
.arrow svg{width:22px;height:22px}
.arrow:hover{background:rgba(20,29,64,.92)}
.arrow:active{transform:var(--t) scale(.9)}
.a-up{--t:translateX(-50%);top:10px;left:50%;transform:var(--t)}
.a-down{--t:translateX(-50%);bottom:10px;left:50%;transform:var(--t)}
.a-left{--t:translateY(-50%);left:10px;top:50%;transform:var(--t)}
.a-right{--t:translateY(-50%);right:10px;top:50%;transform:var(--t)}
.arrow::after{content:attr(data-to);position:absolute;white-space:nowrap;font-size:.7rem;font-weight:800;background:rgba(20,29,64,.85);padding:1px 7px;border-radius:99px;pointer-events:none}
.a-up::after{top:56px}.a-down::after{bottom:56px}.a-left::after{left:0;top:56px}.a-right::after{right:0;top:56px}
.map{position:absolute;top:8px;left:8px;z-index:3;background:rgba(20,29,64,.78);border:2px solid rgba(255,255,255,.55);border-radius:10px;padding:4px;pointer-events:none}
.map svg{display:block}
.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,10px);background:var(--duck);color:#2a1d00;font-weight:800;
  padding:8px 16px;border-radius:999px;max-width:88%;text-align:center;box-shadow:0 4px 0 var(--duck-dk);transition:opacity .2s, transform .2s;opacity:0;pointer-events:none;z-index:6}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fx{position:absolute;pointer-events:none;z-index:5}
.fx.dot{width:10px;height:10px;border-radius:50%;margin:-5px 0 0 -5px}
.fx.plus{font-family:var(--display);font-weight:800;font-size:1.6rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.overlay{position:absolute;inset:0;background:rgba(20,29,64,.9);display:grid;place-items:center;text-align:center;padding:20px;z-index:7}
.overlay h3{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.3rem);margin:0;color:var(--duck);line-height:1.05}
.overlay p{margin:6px 0 16px;color:var(--ink)}
.btn{font-weight:800;border:none;border-radius:999px;padding:11px 22px;background:var(--go);color:#062b1d;cursor:pointer;box-shadow:0 4px 0 var(--go-dk)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--go-dk)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line)}

/* Tool row */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .btn{padding:8px 16px;font-size:.95rem}
.inv{display:flex;gap:6px;margin-left:auto}
.chip{background:var(--panel2);border:2px solid var(--duck);border-radius:99px;padding:3px 10px;font-weight:800;font-size:.85rem;display:flex;align-items:center;gap:5px}

/* Duck Log */
.log h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.log h2 span{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.card.got{border-color:var(--duck)}
.card.new{animation:newcard 1s ease}
@keyframes newcard{0%{transform:scale(1.15);background:var(--duck)}100%{transform:none}}
.card svg{width:60px;height:46px}
.card b{font-size:.88rem;line-height:1.2}
.card small{color:var(--muted);font-size:.75rem;line-height:1.25}
.tier{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;border-radius:99px;padding:0 7px;margin:2px 0}
.t-Easy{background:#2f6b4f;color:#c9f7e2}.t-Sneaky{background:#2d4f8a;color:#d3e4ff}.t-Tricky{background:#6b3f8a;color:#f0dbff}.t-Legendary{background:#8a6a10;color:#fff1b8}
.note{color:var(--muted);font-size:.82rem;margin:2px 0 0}
:focus-visible{outline:3px solid var(--duck);outline-offset:3px}
@media (max-width:420px){.arrow{width:48px;height:48px}.arrow::after{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <svg viewBox="-40 -42 80 62" aria-hidden="true" id="heroDuck"></svg>
      <h1>Quackers</h1>
      <p>Explore each world, find the hidden ducks and fill your Duck Log to unlock the next one.</p>
    </div>
    <div class="worlds" id="worlds"></div>
    <div class="home-foot" style="margin-top:14px">
      <span>Quackers is Mitchell's game. This is an early test version.</span>
      <button class="link" id="reset" type="button">Start over</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" hidden>
    <div class="wrap">
      <div class="top">
        <button class="icon-btn" id="homeBtn" type="button" aria-label="Back to worlds">
          <svg viewBox="0 0 20 20"><path d="M3 9.5 10 3l7 6.5V17h-5v-4H8v4H3z" fill="#f4f6ff"/></svg>
        </button>
        <div class="where"><small id="worldName">World 1</small><b id="areaName">Front Yard</b></div>
        <div class="pill" id="count">0 / 6</div>
        <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound on"></button>
      </div>
      <div class="stage" id="stage">
        <button class="arrow a-up" id="up" type="button" aria-label="Go up"><svg viewBox="0 0 20 20"><path d="M10 3 18 14H2z" fill="#fff"/></svg></button>
        <button class="arrow a-down" id="down" type="button" aria-label="Go down"><svg viewBox="0 0 20 20"><path d="M10 17 2 6h16z" fill="#fff"/></svg></button>
        <button class="arrow a-left" id="left" type="button" aria-label="Go left"><svg viewBox="0 0 20 20"><path d="M3 10 14 2v16z" fill="#fff"/></svg></button>
        <button class="arrow a-right" id="right" type="button" aria-label="Go right"><svg viewBox="0 0 20 20"><path d="M17 10 6 18V2z" fill="#fff"/></svg></button>
        <div class="map" id="map" aria-hidden="true"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="overlay" id="done" hidden><div id="doneBody"></div></div>
      </div>
      <div class="tools">
        <button class="btn" id="hintBtn" type="button">Hint</button>
        <div class="inv" id="inv"></div>
      </div>
      <section class="log">
        <h2>Duck Log <span id="logCount"></span></h2>
        <div class="cards" id="cards"></div>
        <p class="note">Tap arrows or doors to move. Tap anything that looks like it could open. Arrow keys work on a computer.</p>
      </section>
    </div>
  </section>
</div>

<script>
/* ---------- Duck art ---------- */
const ACC = {
  bat:`<path d="M-4 -6 L-24 -24 L-17 -9 L-30 -8 L-6 3 Z" fill="#2a1f3a"/>`,
  pirate:`<path d="M2 -24 Q14 -42 27 -24 Z" fill="#1d1d1d"/><circle cx="14" cy="-30" r="2.2" fill="#fff"/>`,
  snorkel:`<path d="M8 -21 L5 -42" stroke="#ff7a00" stroke-width="3.5" stroke-linecap="round" fill="none"/><rect x="11" y="-25" width="14" height="10" rx="3.5" fill="#8fe3ff" stroke="#203040" stroke-width="2"/>`,
  crown:`<path d="M5 -25 L7 -36 L11.5 -29 L14.5 -38 L17.5 -29 L22 -36 L24 -25 Z" fill="#ffe14d" stroke="#b88a00" stroke-width="1.5"/>`,
  chef:`<rect x="7" y="-32" width="15" height="7" fill="#fff"/><circle cx="10" cy="-34" r="5" fill="#fff"/><circle cx="15" cy="-37" r="5" fill="#fff"/><circle cx="20" cy="-34" r="5" fill="#fff"/>`,
  glow:``,
  mail:`<rect x="26" y="-20" width="12" height="8" fill="#fff" stroke="#999" stroke-width="1"/><path d="M26 -20 L32 -15 L38 -20" stroke="#999" stroke-width="1" fill="none"/>`
};
function duckShape(c, acc){
  const halo = acc==="glow" ? `<circle cx="2" cy="-6" r="36" fill="${c.body}" opacity=".22"/><circle cx="2" cy="-6" r="26" fill="${c.body}" opacity=".18"/>` : "";
  const pre = acc==="bat" ? ACC.bat : "";
  const post = acc && acc!=="bat" ? ACC[acc] : "";
  return `${halo}${pre}<path d="M-20 -4 L-31 -15 L-25 3 Z" fill="${c.body}"/>
  <ellipse cx="0" cy="0" rx="22" ry="15" fill="${c.body}"/>
  <ellipse cx="-3" cy="-2" rx="11" ry="7" fill="${c.wing}"/>
  <circle cx="14" cy="-16" r="11" fill="${c.body}"/>
  <path d="M23 -18 L35 -14 L23 -10 Z" fill="${c.beak}"/>
  <circle cx="17" cy="-19" r="2.3" fill="#1a1a1a"/><circle cx="17.8" cy="-19.8" r=".8" fill="#fff"/>${post}`;
}
const YELLOW = {body:"#FFD43B", wing:"#F5B800", beak:"#FF8A1F"};

/* ---------- Worlds ----------
   Every area: name, map position [col,row], exits {up,down,left,right}, doors [areaIds], draw(F,D).
   F = this world's switches (mailbox open, light on...). D(id,x,y,scale,opts) draws a duck unless already found.
   To add a world: copy one block below, give it new areas and ducks. */
const sky = c => `<rect width="400" height="300" fill="${c}"/>`;
const N = 'pointer-events="none"';
const act = (name, label, inner, cls="") => `<g class="act ${cls}" data-act="${name}" tabindex="0" role="button" aria-label="${label}">${inner}</g>`;
const door = (to, label, inner) => `<g class="door" data-go="${to}" tabindex="0" role="button" aria-label="${label}">${inner}</g>`;
const tag = (x,y,t,fill="#fff") => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Nunito, sans-serif" font-size="11" font-weight="800" fill="${fill}" ${N}>${t}</text>`;
const fish = (x,y,c,flip) => `<g ${N} transform="translate(${x} ${y}) scale(${flip?-1:1} 1)"><ellipse rx="11" ry="6" fill="${c}"/><path d="M-9 0 L-17 -6 L-17 6 Z" fill="${c}"/><circle cx="5" cy="-1.5" r="1.4" fill="#123"/></g>`;
const stars = n => Array.from({length:n},(_,i)=>`<circle cx="${(i*73)%400}" cy="${(i*41)%110+8}" r="${i%3?1:1.6}" fill="#fff" opacity=".7" ${N}/>`).join("");
const books = (y,h,x0,x1,gap) => { let s="",x=x0,i=0; const pal=["#c0392b","#2e86c1","#27ae60","#d4ac0d","#8e44ad","#e67e22"];
  while(x<x1){ const w=9+(i*7)%7; if(!(gap && x>=gap[0] && x<gap[1])){ s+=`<rect x="${x}" y="${y+((i*5)%9)}" width="${w-1}" height="${h-((i*5)%9)}" fill="${gap&&x>=gap[0]-24&&x<gap[1]+24?"#8e44ad":pal[i%pal.length]}"/>`;} x+=w; i++; } return `<g ${N}>${s}</g>`; };

const WORLDS = [
{ id:"w1", name:"The Backyard", start:"yard", art:"#6cc24a", sky:"#8fd3ff",
  ducks:[
    {id:"normal", name:"Normal Duck", tier:"Easy", area:"yard", hint:"Out in the open", c:YELLOW},
    {id:"mail", name:"Mail Duck", tier:"Sneaky", area:"yard", hint:"Got a letter?", c:{body:"#ffd9a0",wing:"#f2b866",beak:"#ff8a1f"}, acc:"mail"},
    {id:"leaf", name:"Leaf Duck", tier:"Sneaky", area:"garden", hint:"Likes bushes", c:{body:"#7FB743",wing:"#5E9330",beak:"#C9A23A"}},
    {id:"rock", name:"Rock Duck", tier:"Sneaky", area:"pond", hint:"Hides by the water", c:{body:"#A6A196",wing:"#8A857B",beak:"#E07B2F"}},
    {id:"tiny", name:"Tiny Duck", tier:"Tricky", area:"treetop", hint:"Way up high", c:YELLOW},
    {id:"bubble", name:"Bubble Duck", tier:"Tricky", area:"house", hint:"Loves bath time", c:{body:"#FF9EC7",wing:"#F57AB0",beak:"#FF8A1F"}}
  ],
  areas:{
    yard:{name:"Front Yard", pos:[1,1], exits:{left:"garden", right:"pond", up:"treetop"}, doors:["house"], draw:(F,D)=>`
      ${sky("#8fd3ff")}<circle cx="345" cy="40" r="22" fill="#ffe66d" ${N}/>
      <g ${N}><ellipse cx="150" cy="50" rx="34" ry="12" fill="#fff" opacity=".85"/><ellipse cx="170" cy="42" rx="22" ry="12" fill="#fff" opacity=".85"/></g>
      <rect y="190" width="400" height="110" fill="#6cc24a"/>
      <path d="M180 300 Q200 240 300 200 L320 200 Q230 245 225 300 Z" fill="#d8b47a" ${N}/>
      <g ${N}><rect x="40" y="105" width="28" height="95" fill="#8b5a2b"/>
      <circle cx="54" cy="92" r="48" fill="#3f9d3a"/><circle cx="24" cy="110" r="26" fill="#3f9d3a"/><circle cx="86" cy="112" r="26" fill="#3f9d3a"/></g>
      <g ${N}><polygon points="220,102 300,48 380,102" fill="#7a3b2e"/>
      <rect x="230" y="100" width="140" height="100" fill="#f06b5b"/>
      <rect x="245" y="120" width="30" height="28" fill="#bfe8ff" stroke="#fff" stroke-width="4"/>
      <rect x="330" y="120" width="30" height="28" fill="#bfe8ff" stroke="#fff" stroke-width="4"/></g>
      ${door("house","Go in the house",`<rect class="dr" x="285" y="138" width="34" height="62" rx="3" fill="#5a3a8a"/><circle cx="312" cy="172" r="3" fill="#ffd43b"/>`)}
      ${tag(302,131,"DOOR")}
      <rect x="176" y="168" width="6" height="34" fill="#6b4a2b" ${N}/>
      ${F.mailbox ? D("mail",179,150,.42) : ""}
      ${act("mailbox","Open the mailbox", F.mailbox
        ? `<rect x="160" y="150" width="38" height="22" rx="10" fill="#4a6fd1"/><rect x="146" y="164" width="16" height="9" rx="2" fill="#3a5bb5"/><rect x="198" y="140" width="4" height="14" fill="#e53935"/>`
        : `<rect x="160" y="150" width="38" height="22" rx="10" fill="#4a6fd1"/><rect x="198" y="152" width="4" height="14" fill="#e53935"/><circle cx="162" cy="161" r="2" fill="#2a3f8f"/>`)}
      ${D("normal",128,242,1)}`},
    garden:{name:"Garden", pos:[0,1], exits:{right:"yard"}, doors:[], draw:(F,D)=>`
      ${sky("#8fd3ff")}<rect y="170" width="400" height="130" fill="#5fb546"/>
      <rect x="0" y="150" width="400" height="22" fill="#b5835a" ${N}/>${Array.from({length:14},(_,i)=>`<rect x="${i*30+4}" y="138" width="14" height="34" fill="#c9966a" ${N}/>`).join("")}
      ${[40,110,180].map(x=>`<g ${N}><rect x="${x}" y="200" width="4" height="30" fill="#2e7d32"/><circle cx="${x+2}" cy="196" r="9" fill="#ff6fa8"/><circle cx="${x+2}" cy="196" r="3" fill="#ffd43b"/></g>`).join("")}
      <ellipse cx="80" cy="262" rx="60" ry="30" fill="#3f8f34" ${N}/>
      ${D("leaf",262,222,.9,{flip:1})}
      <ellipse cx="285" cy="240" rx="52" ry="30" fill="#4a9c3a" ${N}/>
      <ellipse cx="340" cy="252" rx="44" ry="26" fill="#3f8f34" ${N}/>
      <ellipse cx="190" cy="264" rx="40" ry="22" fill="#4a9c3a" ${N}/>`},
    pond:{name:"Pond", pos:[2,1], exits:{left:"yard"}, doors:[], draw:(F,D)=>`
      ${sky("#8fd3ff")}<rect y="160" width="400" height="140" fill="#6cc24a"/>
      <ellipse cx="190" cy="235" rx="170" ry="52" fill="#3c8fd8"/>
      <g ${N}><ellipse cx="190" cy="228" rx="150" ry="40" fill="none" stroke="#7cc0f0" stroke-width="2" opacity=".6"/>
      <ellipse cx="130" cy="230" rx="22" ry="8" fill="#4caf50"/><ellipse cx="220" cy="250" rx="18" ry="6" fill="#4caf50"/>
      ${[40,52,64].map(x=>`<rect x="${x}" y="170" width="3" height="50" fill="#2e7d32"/><rect x="${x-3}" y="165" width="9" height="20" rx="4" fill="#7b4a1e"/>`).join("")}</g>
      ${D("rock",322,180,.7)}
      <ellipse cx="335" cy="200" rx="42" ry="26" fill="#a39e93" ${N}/>
      <ellipse cx="325" cy="192" rx="16" ry="6" fill="#bdb8ad" ${N}/>`},
    treetop:{name:"Top of the Tree", pos:[1,0], exits:{down:"yard"}, doors:[], draw:(F,D)=>`
      ${sky("#a9ddff")}
      <path d="M0 230 Q150 200 400 215 L400 240 Q160 228 0 255 Z" fill="#8b5a2b" ${N}/>

      ${D("glow",110,170,.6)}
      ${F.key ? "" : act("key","Pick up the key",`<g transform="translate(205 252) rotate(-15)"><circle r="16" fill="transparent"/><circle r="9" fill="none" stroke="#ffd43b" stroke-width="5"/><rect x="8" y="-2.5" width="26" height="5" fill="#ffd43b"/><rect x="26" y="0" width="4" height="9" fill="#ffd43b"/><rect x="18" y="0" width="4" height="7" fill="#ffd43b"/></g>`,"pulse")}`
      : `<rect width="400" height="300" fill="#040a16"/>
      ${fishy(0)}${tag(170,190,"Brrr, it's so dark down here...","#5b6a99")}
      ${act("lamp","Tap the glowing light",`<circle cx="340" cy="80" r="22" fill="#ffe66d" opacity=".25"/><circle cx="340" cy="80" r="9" fill="#ffe66d"/>`,"pulse")}`; }}
  }}
];

/* What each tappable thing does. Return a message to show. */
const ACTS = {
  mailbox:F=>{ if(F.mailbox) return "It's already open."; F.mailbox=1; return "Creak! The mailbox opens."; },
  lid:F=>{ F.lid=1; return "You lift the lid... something smells good!"; },
  light:F=>{ F.light = F.light?0:1; return F.light ? "Click! The light is on." : "Lights off. Spooky!"; },
  clam:F=>{ F.clam=1; return "The clam opens up!"; },
  lamp:F=>{ F.lamp = F.lamp?0:1; return F.lamp ? "The fish's light glows bright!" : "Back to the dark..."; },
  key:F=>{ F.key=1; return "You found a key! It must open something."; },
  chest:F=>{ if(!F.key) return "Locked tight. A key must be hiding somewhere dark."; F.chest=1; return "The key fits. The chest pops open!"; }
};

/* ---------- State and saving ---------- */
const SAVE = "quackers-v2";
const allDucks = WORLDS.flatMap((w,wi)=>w.ducks.map(d=>({...d, world:wi})));
const DUCK = Object.fromEntries(allDucks.map(d=>[d.id,d]));
function fresh(){ return {found:[], flags:{w1:{},w2:{},w3:{}}, visited:{w1:[],w2:[],w3:[]}, unlocked:1, sound:true, world:0, area:{}}; }
let S = fresh();
function load(){ try{ const s = JSON.parse(localStorage.getItem(SAVE)||"null"); if(s && s.flags) S = Object.assign(fresh(), s); }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){} }
const found = new Set();
function syncFound(){ found.clear(); S.found.forEach(id=>found.add(id)); }
const W = () => WORLDS[S.world];
const F = () => S.flags[W().id];
const curArea = () => S.area[W().id] || W().start;
const worldDone = wi => WORLDS[wi].ducks.every(d=>found.has(d.id));
const worldCount = wi => WORLDS[wi].ducks.filter(d=>found.has(d.id)).length;

/* ---------- Drawing ---------- */
const $ = id => document.getElementById(id);
function D(id,x,y,s,o={}){
  if(found.has(id)) return "";
  const d = DUCK[id]; const sx = o.flip ? -s : s, sy = o.upside ? -s : s;
  const op = d.opacity ? ` opacity="${d.opacity}"` : "";
  return `<g class="duck" data-duck="${id}" tabindex="0" role="button" aria-label="Something hiding" transform="translate(${x} ${y}) scale(${sx} ${sy})"${op}>
    <circle cx="4" cy="-6" r="30" fill="transparent"/>${duckShape(d.c,d.acc)}</g>`;
}
function sceneSVG(){ return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">${W().areas[curArea()].draw(F(), D)}</svg>`; }

function renderMap(){
  const w = W(), A = w.areas, cell=22, gap=8, ch=cell*.75;
  const ids = Object.keys(A); const vis = new Set(S.visited[w.id]);
  const cols = Math.max(...ids.map(k=>A[k].pos[0]))+1, rows = Math.max(...ids.map(k=>A[k].pos[1]))+1;
  const cx = k => A[k].pos[0]*(cell+gap)+cell/2+2, cy = k => A[k].pos[1]*(ch+gap)+ch/2+2;
  let lines="", boxes="";
  ids.forEach(k=>{
    Object.values(A[k].exits).forEach(t=>{ if(k<t) lines+=`<line x1="${cx(k)}" y1="${cy(k)}" x2="${cx(t)}" y2="${cy(t)}" stroke="#fff" stroke-width="2" opacity=".6"/>`; });
    A[k].doors.forEach(t=>{ if(k<t) lines+=`<line x1="${cx(k)}" y1="${cy(k)}" x2="${cx(t)}" y2="${cy(t)}" stroke="#fff" stroke-width="2" stroke-dasharray="2 3" opacity=".6"/>`; });
  });
  const hint = $("map").dataset.hint;
  ids.forEach(k=>{
    const here = k===curArea(), seen = vis.has(k);
    boxes += `<rect x="${cx(k)-cell/2}" y="${cy(k)-ch/2}" width="${cell}" height="${ch}" rx="4"
      fill="${here?"#ffd43b":seen?"#4a5db0":"#1b2450"}" stroke="${k===hint?"#4cd2a0":"#fff"}" stroke-width="${k===hint?3:1.5}" ${k===hint?'class="pulse"':""}/>`;
    if(!seen && !here) boxes += `<text x="${cx(k)}" y="${cy(k)+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#8a96d0" font-family="Nunito,sans-serif">?</text>`;
  });
  const wpx = cols*(cell+gap)-gap+4, hpx = rows*(ch+gap)-gap+4;
  $("map").innerHTML = `<svg viewBox="0 0 ${wpx} ${hpx}" width="${Math.round(wpx*1.1)}" height="${Math.round(hpx*1.1)}">${lines}${boxes}</svg>`;
}
function renderArrows(){
  const a = W().areas[curArea()];
  ["up","down","left","right"].forEach(d=>{ const to = a.exits[d]; $(d).hidden = !to; if(to){ $(d).dataset.to = W().areas[to].name; $(d).setAttribute("aria-label", `Go to ${W().areas[to].name}`);} });
}
function renderTop(){
  $("worldName").textContent = `World ${S.world+1}: ${W().name}`;
  $("areaName").textContent = W().areas[curArea()].name;
  const n = worldCount(S.world), t = W().ducks.length;
  $("count").textContent = `${n} / ${t}`;
  $("count").setAttribute("aria-label", `${n} of ${t} ducks found`);
  $("logCount").textContent = `${n} of ${t} found`;
  const f = F(); $("inv").innerHTML = (f.key && !f.chest) ? `<span class="chip"><svg width="16" height="12" viewBox="-10 -8 44 18"><circle r="7" fill="none" stroke="#ffd43b" stroke-width="4"/><rect x="6" y="-2" width="24" height="4" fill="#ffd43b"/></svg>Key</span>` : "";
}
function renderLog(newId){
  $("cards").innerHTML = W().ducks.map(d=>{
    const got = found.has(d.id);
    const shape = got ? duckShape(d.c, d.acc==="glow"?null:d.acc) : duckShape({body:"#34447f",wing:"#34447f",beak:"#34447f"});
    return `<div class="card ${got?"got":""} ${d.id===newId?"new":""}">
      <svg viewBox="-34 -42 72 60" aria-hidden="true">${shape}</svg>
      <span class="tier t-${d.tier}">${d.tier}</span><b>${got?d.name:"???"}</b><small>${got?"Found!":d.hint}</small></div>`;
  }).join("");
}
function renderHome(){
  $("heroDuck").innerHTML = duckShape(YELLOW);
  $("worlds").innerHTML = WORLDS.map((w,i)=>{
    const open = i < S.unlocked, n = worldCount(i), t = w.ducks.length, done = n===t;
    return `<button class="wcard" type="button" data-world="${i}" ${open?"":"disabled"}>
      ${done?'<span class="badge">Complete</span>':""}
      <svg class="art" viewBox="0 0 200 84" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="200" height="84" fill="${w.sky}"/><path d="M0 60 Q100 44 200 60 V84 H0Z" fill="${w.art}"/>
        <g transform="translate(100 52) scale(.8)">${open?duckShape(w.ducks[0].c, w.ducks[0].acc):`<rect x="-14" y="-12" width="28" height="22" rx="4" fill="#1b2450"/><path d="M-8 -12 v-8 a8 8 0 0 1 16 0 v8" stroke="#1b2450" stroke-width="5" fill="none"/>`}</g></svg>
      <span class="info"><small>World ${i+1}</small><b>${w.name}</b>
        <span class="bar"><i style="width:${Math.round(n/t*100)}%"></i></span>
        <span class="status">${open ? (done ? `All ${t} ducks found` : `${n} of ${t} ducks found`) : `Finish World ${i} to unlock`}</span></span></button>`;
  }).join("");
}

/* ---------- Moving around ---------- */
let busy = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function showArea(kind){
  const stage = $("stage"), olds = [...stage.querySelectorAll(".layer")];
  const layer = document.createElement("div"); layer.className="layer"; layer.innerHTML = sceneSVG();
  stage.insertBefore(layer, stage.firstChild);
  const vis = S.visited[W().id]; if(!vis.includes(curArea())) vis.push(curArea());
  $("map").dataset.hint = ""; renderMap(); renderArrows(); renderTop(); save();
  if(!olds.length) return;
  if(reduce || !kind || !layer.animate){ olds.forEach(o=>o.remove()); return; }
  busy = true;
  const old = olds[0]; olds.slice(1).forEach(o=>o.remove());
  const dirs = {left:[-1,0], right:[1,0], up:[0,-1], down:[0,1]};
  let a, b;
  if(kind==="door"){ a=[{transform:"scale(1)",opacity:1},{transform:"scale(1.25)",opacity:0}]; b=[{transform:"scale(.85)",opacity:0},{transform:"scale(1)",opacity:1}]; }
  else { const [dx,dy]=dirs[kind]; a=[{transform:"none"},{transform:`translate(${-dx*100}%,${-dy*100}%)`}]; b=[{transform:`translate(${dx*100}%,${dy*100}%)`},{transform:"none"}]; }
  const opt = {duration:320, easing:"cubic-bezier(.3,.7,.2,1)"};
  const done = ()=>{ old.remove(); busy=false; };
  old.animate(a,opt); const an = layer.animate(b,opt); an.onfinish = done; setTimeout(()=>{ if(busy) done(); }, 700);
}
const layerEl = () => $("stage").querySelector(".layer");
function move(dir){ if(busy || !$("done").hidden) return; const to = W().areas[curArea()].exits[dir]; if(!to) return; S.area[W().id]=to; blip(dir); showArea(dir); }
function enterDoor(to){ if(busy) return; S.area[W().id]=to; blip("door"); showArea("door"); }
["up","down","left","right"].forEach(d => $(d).addEventListener("click", ()=>move(d)));
addEventListener("keydown", e=>{
  if($("play").hidden) return;
  const k = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];
  if(k && !e.target.closest(".duck,.act,.door")){ e.preventDefault(); move(k); }
});

/* ---------- Sound ---------- */
let actx=null;
function ctx(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }catch(e){ return null; } }
function tone(f1,f2,dur,type="sine",vol=.18,when=0){
  if(!S.sound) return; const c=ctx(); if(!c) return;
  try{ const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    fl.type="lowpass"; fl.frequency.value=1600; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}
const quack = ()=>{ tone(560,260,.18,"sawtooth",.25); tone(520,250,.16,"sawtooth",.18,.2); };
const blip = (k)=> tone(k==="door"?300:420, k==="door"?200:520, .08, "triangle", .08);
const pop = ()=> tone(300,700,.12,"sine",.15);
const fanfare = ()=> [523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,.22,"triangle",.16,i*.13));
function setSoundBtn(){ $("soundBtn").innerHTML = `<svg viewBox="0 0 20 20"><path d="M3 7h4l5-4v14l-5-4H3z" fill="#f4f6ff"/>${S.sound?'<path d="M14 6q3 4 0 8" stroke="#f4f6ff" stroke-width="2" fill="none"/>':'<path d="M14 7l5 6M19 7l-5 6" stroke="#f4f6ff" stroke-width="2"/>'}</svg>`;
  $("soundBtn").setAttribute("aria-pressed", String(S.sound)); $("soundBtn").setAttribute("aria-label", S.sound?"Sound on":"Sound off"); }
$("soundBtn").addEventListener("click", ()=>{ S.sound=!S.sound; save(); setSoundBtn(); });

/* ---------- Finding ducks ---------- */
let toastTimer;
function toast(msg, ms=1800){ if(!msg) return; const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),ms); }
function burst(x,y,colors){
  if(reduce) return; const stage=$("stage");
  for(let i=0;i<14;i++){ const p=document.createElement("div"); p.className="fx dot"; p.style.left=x+"px"; p.style.top=y+"px"; p.style.background=colors[i%colors.length]; stage.appendChild(p);
    const a=i/14*Math.PI*2, r=40+Math.random()*40;
    if(p.animate) p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`,opacity:0}],{duration:650,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>p.remove(); else p.remove(); }
  const plus=document.createElement("div"); plus.className="fx plus"; plus.textContent="+1"; plus.style.left=x+"px"; plus.style.top=y+"px"; stage.appendChild(plus);
  if(plus.animate) plus.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:"translate(-50%,-160%)",opacity:0}],{duration:900,easing:"ease-out"}).onfinish=()=>plus.remove(); else plus.remove();
}
function catchDuck(el){
  const id = el.dataset.duck; if(found.has(id)) return;
  found.add(id); S.found.push(id); save();
  const sr=$("stage").getBoundingClientRect(), r=el.getBoundingClientRect();
  burst(r.left+r.width/2-sr.left, r.top+r.height/2-sr.top, [DUCK[id].c.body,"#fff","#ffd43b"]);
  quack();
  el.style.pointerEvents="none";
  if(el.animate && !reduce){ const tf = el.getAttribute("transform"); el.removeAttribute("transform"); el.style.transformBox="view-box";
    el.animate([{transform:css(tf)+" scale(1)"},{transform:css(tf)+" scale(1.5)",opacity:1},{transform:css(tf)+" scale(0)",opacity:0}],{duration:380,fill:"forwards"}); }
  toast(`You found the ${DUCK[id].name}!`);
  $("count").classList.remove("bump"); void $("count").offsetWidth; $("count").classList.add("bump");
  renderLog(id); renderTop();
  setTimeout(()=>{ const l=layerEl(); if(l) l.innerHTML=sceneSVG(); if(worldDone(S.world) && $("done").hidden) worldComplete(); }, 420);
}
const css = tf => tf.replace(/translate\(([-\d.]+) ([-\d.]+)\)/,"translate($1px,$2px)").replace(/scale\(([-\d.]+) ([-\d.]+)\)/,"scale($1,$2)");
function worldComplete(){
  const last = S.world === WORLDS.length-1;
  if(!last) S.unlocked = Math.max(S.unlocked, S.world+2); save();
  fanfare();
  const total = allDucks.length, all = allDucks.every(d=>found.has(d.id));
  let html;
  if(all) html = `<h3>You found all ${total} ducks!</h3><p>Every Duck Log is full. More worlds are up to Mitchell.</p><button class="btn" id="doneBtn" type="button">Back to worlds</button>`;
  else if(last) html = `<h3>World ${S.world+1} complete!</h3><p>All ${W().ducks.length} ducks found here. Some worlds still have ducks to find.</p><button class="btn" id="doneBtn" type="button">Back to worlds</button>`;
  else html = `<h3>World ${S.world+1} complete!</h3><p>All ${W().ducks.length} ducks found. Next up: ${WORLDS[S.world+1].name}.</p><button class="btn" id="doneBtn" type="button">Go to World ${S.world+2}</button> <button class="btn ghost" id="doneHome" type="button">Worlds</button>`;
  $("doneBody").innerHTML = html;
  $("done").hidden = false;
  const sr=$("stage").getBoundingClientRect(); for(let k=0;k<3;k++) setTimeout(()=>burst(sr.width*(.25+k*.25), sr.height*.35, ["#ffd43b","#4cd2a0","#ff7aa8","#8fe3ff"]), k*180);
  const nextWorld = last || all ? null : S.world+1;
  $("doneBtn").addEventListener("click", ()=>{ $("done").hidden=true; if(nextWorld===null) goHome(); else openWorld(nextWorld); });
  if($("doneHome")) $("doneHome").addEventListener("click", ()=>{ $("done").hidden=true; goHome(); });
}
function onStageTap(e){
  if(busy || !$("done").hidden) return;
  const d = e.target.closest(".duck"); if(d){ catchDuck(d); return; }
  const a = e.target.closest(".act");
  if(a){ const msg = ACTS[a.dataset.act](F()); pop(); toast(msg); save(); layerEl().innerHTML = sceneSVG(); renderTop(); return; }
  const g = e.target.closest(".door"); if(g) enterDoor(g.dataset.go);
}
$("stage").addEventListener("click", onStageTap);
$("stage").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.closest(".duck,.act,.door")){ e.preventDefault(); onStageTap(e); } });

$("hintBtn").addEventListener("click", ()=>{
  const left = W().ducks.filter(d=>!found.has(d.id));
  if(!left.length){ toast("You've found every duck here!"); return; }
  const d = left.find(x=>x.area===curArea()) || left[0]; const where = W().areas[d.area].name;
  toast(d.area===curArea() ? `A duck is hiding right here! Hint: ${d.hint.toLowerCase()}.` : `Psst... try the ${where}.`, 2600);
  $("map").dataset.hint = d.area; renderMap();
});

/* ---------- Screens ---------- */
function openWorld(i){
  S.world = i; save();
  $("home").hidden = true; $("play").hidden = false; $("done").hidden = true;
  $("stage").querySelectorAll(".layer").forEach(l=>l.remove());
  busy = false;
  renderLog(); showArea(null);
  if(worldDone(i)) toast("This world is complete. Explore all you like!");
}
function goHome(){ renderHome(); $("play").hidden = true; $("home").hidden = false; scrollTo(0,0); }
$("homeBtn").addEventListener("click", goHome);
$("worlds").addEventListener("click", e=>{ const b=e.target.closest(".wcard"); if(b && !b.disabled) openWorld(+b.dataset.world); });
$("reset").addEventListener("click", ()=>{
  const b=$("reset");
  if(b.dataset.sure){ S=fresh(); syncFound(); save(); delete b.dataset.sure; b.textContent="Start over"; renderHome(); }
  else { b.dataset.sure="1"; b.textContent="Tap again to erase all progress"; setTimeout(()=>{ delete b.dataset.sure; b.textContent="Start over"; },4000); }
});

/* Test hook (used only by automated checks) */
window.QUACKERS = { WORLDS, get state(){ return S; }, openWorld, go:(a)=>{ S.area[W().id]=a; showArea(null); } };

load(); syncFound(); setSoundBtn(); renderHome();
</script>
</body>
</html>
