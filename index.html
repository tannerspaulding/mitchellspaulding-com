<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quackers</title>
<meta name="description" content="Quackers: explore the worlds, find the hidden ducks and fill your Duck Log.">
<meta name="theme-color" content="#BFE6FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14314F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="brand/quackers-icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Quackers">
<meta name="application-name" content="Quackers">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@700;800;900&family=Patrick+Hand&display=swap">
<style>
/* Quackers, Pond Morning look (see brand/brand-guide.html).
   Layout: two screens. Home: logo, keep-exploring button, world cards. Play: top bar, the scene with edge arrows and a corner map, a tool row, then the Duck Log sticker book.
   Every tappable thing is white or yellow, has a 3px ink outline and sits on a ledge that squishes when pressed. */
:root{
  --ink:#173A5E; --duck:#FFCB2F; --duck-deep:#F0A500; --beak:#FF8A3D; --pond:#2387D9; --puddle:#8FD0FF;
  --lily:#3FB86A; --bubble:#FF6FA6; --cloud:#FFFFFF; --mist:#DCEBF7; --soft:#9DB7D2; --dim:#4F6E8C;
  --sky-top:#BFE6FF; --sky-bot:#EAF6FF; --text:#173A5E; --muted:#4F6E8C; --cloud-o:.8;
  --display:"Grandstander","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --note:"Patrick Hand","Comic Neue","Chalkboard SE",cursive;
  --squish:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--sky-top:#14314F; --sky-bot:#0D1F33; --text:#EAF4FF; --muted:#9DB7D2; --cloud-o:.08; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--sky-bot)}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;
  background:linear-gradient(var(--sky-top) 0, var(--sky-bot) 520px) no-repeat, var(--sky-bot);
  padding-left:max(14px, env(safe-area-inset-left, 0px));
  padding-right:max(14px, env(safe-area-inset-right, 0px));
  padding-block:max(12px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative}
.screen-in{animation:screenIn .42s var(--squish)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.98)}}

/* Clouds drifting behind everything */
.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.cloud{position:absolute;height:28px;background:#fff;border-radius:99px;opacity:var(--cloud-o)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:38px;height:38px;left:16px;top:-18px}.cloud::after{width:28px;height:28px;left:44px;top:-11px}
.c1{width:104px;top:9%;left:-120px;animation:drift 70s linear infinite}
.c2{width:84px;top:22%;left:-120px;animation:drift 95s linear -40s infinite}
.c3{width:120px;top:48%;left:-140px;animation:drift 120s linear -80s infinite}
@keyframes drift{to{transform:translateX(calc(100vw + 280px))}}

/* Chunky press-able things */
.btn{font-family:var(--display);font-weight:900;font-size:1.12rem;letter-spacing:.01em;border:3px solid var(--ink);border-radius:18px;padding:10px 20px;
  background:var(--duck);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .09s, box-shadow .09s, filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--cloud)}
.btn.go{background:var(--lily);color:#fff;text-shadow:0 2px 0 rgba(23,58,94,.35)}
.btn svg{width:22px;height:22px;flex:none}
.round{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--cloud);cursor:pointer;display:grid;place-items:center;padding:0;flex:none;
  box-shadow:0 4px 0 var(--ink);transition:transform .09s, box-shadow .09s}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round svg{width:22px;height:22px}

/* Home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:10px}
.hero .logo{width:min(100%,540px);height:auto;display:block;overflow:visible}
.hero .logo .logo-duck{animation:float 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hero .logo .ripple{animation:ripple 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes ripple{50%{transform:translateX(6px)}}
.tagline{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,4.6vw,1.45rem);margin:0}
.lead{color:var(--muted);margin:0 auto;max-width:34ch;font-size:1rem}
.start{margin-top:10px;width:min(100%,380px);font-size:1.2rem;padding:13px 20px}
.section-title{font-family:var(--display);font-weight:900;font-size:1.45rem;margin:12px 2px 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title span{font-family:var(--body);font-weight:700;font-size:.92rem;color:var(--muted)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:14px}
.wcard{position:relative;text-align:left;border:3px solid var(--ink);border-radius:24px;background:var(--cloud);color:var(--ink);padding:0;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;box-shadow:0 5px 0 var(--ink);transition:transform .15s var(--squish), box-shadow .1s}
.wcard:not(:disabled):hover{transform:translateY(-3px) rotate(-.6deg)}
.wcard:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.wcard:disabled{cursor:not-allowed;background:#F3F7FB}
.wcard:disabled .art{filter:saturate(.2) brightness(1.08)}
.wcard .art{display:block;width:100%;height:auto;aspect-ratio:25/12;border-bottom:3px solid var(--ink)}
.wcard .info{padding:10px 12px 13px;display:flex;flex-direction:column;gap:6px}
.wcard .info small{font-family:var(--display);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--pond)}
.wcard .info b{font-family:var(--display);font-weight:900;font-size:1.28rem;line-height:1}
.eggs{display:flex;gap:4px;flex-wrap:wrap}
.eggs i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.eggs i.on{background:var(--duck)}
.wcard .status{font-size:.86rem;line-height:1.25;color:var(--dim);font-weight:700}
.lock{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center}
.lock svg{width:20px;height:20px}
.stamp{position:absolute;top:12px;right:8px;transform:rotate(12deg);font-family:var(--display);font-weight:900;font-size:.76rem;color:#fff;background:var(--lily);border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px}
.home-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:16px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px;font-weight:700}

/* Top bar */
.top{display:flex;align-items:center;gap:10px}
.where{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.where small{color:var(--pond);font-family:var(--display);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme: dark){.where small{color:var(--puddle)}}
.where b{font-family:var(--display);font-weight:900;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where b.pop{animation:namePop .45s var(--squish)}
@keyframes namePop{from{transform:translateY(6px);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--cloud);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:2px 12px 2px 5px;
  font-family:var(--display);font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.pill svg{width:30px;height:24px}
.pill.bump{animation:bump .55s var(--squish)}
@keyframes bump{30%{transform:scale(1.25) rotate(-4deg);background:var(--duck)}}

/* Stage */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:26px;overflow:hidden;border:3px solid var(--ink);background:#0D1F33;
  box-shadow:0 6px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;isolation:isolate}
.stage::after{content:"";position:absolute;inset:0;border-radius:23px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), inset 0 -18px 30px rgba(13,31,51,.12);pointer-events:none;z-index:4}
.layer{position:absolute;inset:0}
.layer svg{display:block;width:100%;height:100%}
.duck,.act,.door{cursor:pointer;outline:none}
.door:hover .dr,.door:focus-visible .dr{filter:brightness(1.35)}
.act:hover,.act:focus-visible{filter:brightness(1.2)}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.5}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-4px)}}
.arrow{position:absolute;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;padding:0;z-index:5;box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s}
.arrow svg{width:24px;height:24px}
.arrow:hover{background:#FFF6D6}
.arrow:active{transform:var(--t) translateY(3px);box-shadow:0 1px 0 var(--ink)}
.a-up{--t:translateX(-50%);top:10px;left:50%;transform:var(--t)}
.a-down{--t:translateX(-50%);bottom:14px;left:50%;transform:var(--t)}
.a-left{--t:translateY(-50%);left:10px;top:50%;transform:var(--t)}
.a-right{--t:translateY(-50%);right:10px;top:50%;transform:var(--t)}
.arrow::after{content:attr(data-to);position:absolute;white-space:nowrap;font-family:var(--display);font-size:.74rem;font-weight:800;color:var(--ink);background:#fff;
  border:2px solid var(--ink);padding:0 8px;border-radius:99px;pointer-events:none}
.a-up::after{top:54px}.a-down::after{bottom:56px}.a-left::after{left:-3px;top:56px}.a-right::after{right:-3px;top:56px}
.map{position:absolute;top:8px;left:8px;z-index:5;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:4px;pointer-events:none;box-shadow:0 3px 0 rgba(23,58,94,.35)}
.map svg{display:block}
.toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,12px) scale(.9);background:#fff;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1rem;
  padding:7px 16px;border-radius:999px;border:3px solid var(--ink);max-width:88%;text-align:center;box-shadow:0 4px 0 var(--ink);
  transition:opacity .2s, transform .3s var(--squish);opacity:0;pointer-events:none;z-index:7}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.found{background:var(--duck)}
.fx{position:absolute;pointer-events:none;z-index:6}
.fx.dot{width:11px;height:11px;border-radius:50%;margin:-5px 0 0 -5px;border:2px solid var(--ink)}
.fx.plus{font-family:var(--display);font-weight:900;font-size:1.8rem;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;transform:translate(-50%,-50%)}
.overlay{position:absolute;inset:0;background:rgba(13,31,51,.62);display:grid;place-items:center;padding:16px;z-index:8;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
.done-card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:10px 18px 18px;text-align:center;max-width:340px;
  display:flex;flex-direction:column;align-items:center;gap:4px;animation:cardIn .55s var(--squish)}
@keyframes cardIn{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.done-card svg{width:110px;height:92px;animation:float 2.6s ease-in-out infinite}
.done-card h3{font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,6vw,2rem);margin:0;line-height:1.05}
.done-card p{margin:0 0 10px;color:var(--dim);font-size:.98rem}
.done-card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Tool row */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.tools .btn{padding:7px 16px;font-size:1rem}
.inv{display:flex;gap:6px;margin-left:auto}
.chip{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:3px 12px 3px 8px;font-family:var(--display);font-weight:900;font-size:.92rem;display:flex;align-items:center;gap:6px;animation:cardIn .5s var(--squish)}

/* Duck Log sticker book */
.log{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:26px;padding:14px 14px 16px;box-shadow:0 6px 0 var(--ink);
  background-image:radial-gradient(circle, #DCEBF7 1.3px, transparent 1.6px);background-size:18px 18px;background-position:4px 4px}
.log h2{font-family:var(--display);font-weight:900;font-size:1.5rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.log h2 span{font-family:var(--display);font-size:.95rem;color:var(--dim);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0;
  box-shadow:0 4px 0 rgba(23,58,94,.25)}
.card.got:nth-child(odd){transform:rotate(-1.6deg)}.card.got:nth-child(even){transform:rotate(1.4deg)}
.card.miss{background:rgba(255,255,255,.7);border:2.5px dashed var(--soft);box-shadow:none}
.card.new{animation:slap .7s var(--squish)}
@keyframes slap{0%{transform:scale(1.5) rotate(-12deg);opacity:0}60%{opacity:1}}
.card svg{width:68px;height:56px}
.card b{font-family:var(--display);font-weight:800;font-size:.92rem;line-height:1.1}
.card .hint{font-family:var(--note);font-size:1.02rem;color:var(--dim);line-height:1.1}
.tier{font-family:var(--display);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900;border-radius:99px;padding:1px 8px;border:2px solid var(--ink);color:var(--ink)}
.t-Easy{background:#C9F2D6}.t-Sneaky{background:#E2D8FF}.t-Tricky{background:#FFD4E5}.t-Legendary{background:linear-gradient(90deg,#FFE58A,#FFC23A)}
.card.miss .tier{opacity:.75}
.note{color:var(--dim);font-family:var(--note);font-size:1.08rem;line-height:1.25;margin:12px 2px 0}
:focus-visible{outline:3px solid var(--pond);outline-offset:3px}
@media (max-width:420px){.arrow{width:48px;height:48px}.arrow::after{display:none}.round{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>
<div class="wrap">

  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <h1 style="margin:0;width:100%;display:grid;place-items:center" id="heroLogo"><span hidden>Quackers</span></h1>
      <p class="tagline">Somewhere, a duck is hiding.</p>
      <p class="lead">Explore each world, find every hidden duck and fill your Duck Log.</p>
      <button class="btn start" id="startBtn" type="button">Let's go!</button>
    </div>
    <h2 class="section-title">Pick a world <span id="totalFound"></span></h2>
    <div class="worlds" id="worlds"></div>
    <div class="home-foot">
      <span>A game by Mitchell. Early test version.</span>
      <button class="link" id="reset" type="button">Start over</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" hidden>
    <div class="wrap">
      <div class="top">
        <button class="round" id="homeBtn" type="button" aria-label="Back to worlds">
          <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4.5l8 7V20h-5.5v-5h-5v5H4z" fill="#FFCB2F" stroke="#173A5E" stroke-width="2.4" stroke-linejoin="round"/></svg>
        </button>
        <div class="where"><small id="worldName">World 1</small><b id="areaName">Front Yard</b></div>
        <div class="pill" id="count">0 / 6</div>
        <button class="round" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound on"></button>
      </div>
      <div class="stage" id="stage">
        <button class="arrow a-up" id="up" type="button" aria-label="Go up"><svg viewBox="0 0 24 24"><path d="M5 15 L12 8 L19 15" fill="none" stroke="#173A5E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="arrow a-down" id="down" type="button" aria-label="Go down"><svg viewBox="0 0 24 24"><path d="M5 9 L12 16 L19 9" fill="none" stroke="#173A5E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="arrow a-left" id="left" type="button" aria-label="Go left"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="#173A5E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="arrow a-right" id="right" type="button" aria-label="Go right"><svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19" fill="none" stroke="#173A5E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="map" id="map" aria-hidden="true"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="overlay" id="done" hidden><div class="done-card" id="doneBody"></div></div>
      </div>
      <div class="tools">
        <button class="btn alt" id="hintBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="#DDF1FF" stroke="#173A5E" stroke-width="2.6"/><path d="M15 15 L20 20" stroke="#173A5E" stroke-width="3.2" stroke-linecap="round"/></svg>Hint</button>
        <div class="inv" id="inv"></div>
      </div>
      <section class="log">
        <h2>Duck Log <span id="logCount"></span></h2>
        <div class="cards" id="cards"></div>
        <p class="note">Tap the arrows or doors to explore. Poke anything that might open. Arrow keys work on a computer too.</p>
      </section>
    </div>
  </section>
</div>

<script src="brand/brand-art.js"></script>
<script>
/* ---------- Duck art ---------- */
const ACC = {
  bat:`<path d="M-4 -6 L-24 -24 L-17 -9 L-30 -8 L-6 3 Z" fill="#2a1f3a"/>`,
  pirate:`<path d="M2 -24 Q14 -42 27 -24 Z" fill="#1d1d1d"/><circle cx="14" cy="-30" r="2.2" fill="#fff"/>`,
  snorkel:`<path d="M8 -21 L5 -42" stroke="#ff7a00" stroke-width="3.5" stroke-linecap="round" fill="none"/><rect x="11" y="-25" width="14" height="10" rx="3.5" fill="#8fe3ff" stroke="#203040" stroke-width="2"/>`,
  crown:`<path d="M5 -25 L7 -36 L11.5 -29 L14.5 -38 L17.5 -29 L22 -36 L24 -25 Z" fill="#ffe14d" stroke="#b88a00" stroke-width="1.5"/>`,
  chef:`<rect x="7" y="-32" width="15" height="7" fill="#fff"/><circle cx="10" cy="-34" r="5" fill="#fff"/><circle cx="15" cy="-37" r="5" fill="#fff"/><circle cx="20" cy="-34" r="5" fill="#fff"/>`,
  glow:``,
  mail:`<rect x="26" y="-20" width="12" height="8" fill="#fff" stroke="#999" stroke-width="1"/><path d="M26 -20 L32 -15 L38 -20" stroke="#999" stroke-width="1" fill="none"/>`
};
/* o.outline: brand sticker look (ink line, cheek). o.ghost: empty Duck Log slot. Scene ducks stay unoutlined so hiding is fair. */
const INK = "#173A5E";
function duckShape(c, acc, o={}){
  const ghost = !!o.ghost, line = o.outline||ghost;
  const L = line ? ` stroke="${ghost?"#9DB7D2":INK}" stroke-width="2.4" stroke-linejoin="round"` : "";
  const halo = acc==="glow" ? `<circle cx="2" cy="-6" r="36" fill="${c.body}" opacity=".22"/><circle cx="2" cy="-6" r="26" fill="${c.body}" opacity=".18"/>` : "";
  const pre = acc==="bat" ? ACC.bat : "";
  const post = acc && acc!=="bat" ? ACC[acc] : "";
  return `${halo}${pre}<path d="M-19 -3 Q-30 -6 -32 -17 Q-24 -13 -16 -9 Z" fill="${c.body}"${L}/>
  <ellipse cx="0" cy="0" rx="22" ry="15" fill="${c.body}"${L}/>

/* What each tappable thing does. Return a message to show. */
const ACTS = {
  mailbox:F=>{ if(F.mailbox) return "It's already open."; F.mailbox=1; return "Creak! The mailbox opens."; },
  lid:F=>{ F.lid=1; return "You lift the lid... something smells good!"; },
  light:F=>{ F.light = F.light?0:1; return F.light ? "Click! The light is on." : "Lights off. Spooky!"; },
  clam:F=>{ F.clam=1; return "The clam opens up!"; },
  lamp:F=>{ F.lamp = F.lamp?0:1; return F.lamp ? "The fish's light glows bright!" : "Back to the dark..."; },
  key:F=>{ F.key=1; return "You found a key! It must open something."; },

/* ---------- State and saving ---------- */
const SAVE = "quackers-v2";
const allDucks = WORLDS.flatMap((w,wi)=>w.ducks.map(d=>({...d, world:wi})));
const DUCK = Object.fromEntries(allDucks.map(d=>[d.id,d]));
function fresh(){ return {found:[], flags:{w1:{},w2:{},w3:{}}, visited:{w1:[],w2:[],w3:[]}, unlocked:1, sound:true, world:0, area:{}}; }
let S = fresh();
function load(){ try{ const s = JSON.parse(localStorage.getItem(SAVE)||"null"); if(s && s.flags) S = Object.assign(fresh(), s); }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){} }
const found = new Set();
function syncFound(){ found.clear(); S.found.forEach(id=>found.add(id)); }
const W = () => WORLDS[S.world];
const F = () => S.flags[W().id];
const curArea = () => S.area[W().id] || W().start;
const worldDone = wi => WORLDS[wi].ducks.every(d=>found.has(d.id));
const worldCount = wi => WORLDS[wi].ducks.filter(d=>found.has(d.id)).length;

/* ---------- Drawing ---------- */
const $ = id => document.getElementById(id);
function D(id,x,y,s,o={}){
  if(found.has(id)) return "";
  const d = DUCK[id]; const sx = o.flip ? -s : s, sy = o.upside ? -s : s;
  const op = d.opacity ? ` opacity="${d.opacity}"` : "";
  return `<g class="duck" data-duck="${id}" tabindex="0" role="button" aria-label="Something hiding" transform="translate(${x} ${y}) scale(${sx} ${sy})"${op}>
    <circle cx="4" cy="-6" r="30" fill="transparent"/>${duckShape(d.c,d.acc)}</g>`;
}
function sceneSVG(){ return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">${W().areas[curArea()].draw(F(), D)}</svg>`; }

function renderMap(){
  const w = W(), A = w.areas, cell=22, gap=8, ch=cell*.75;
  const ids = Object.keys(A); const vis = new Set(S.visited[w.id]);
  const cols = Math.max(...ids.map(k=>A[k].pos[0]))+1, rows = Math.max(...ids.map(k=>A[k].pos[1]))+1;
  const cx = k => A[k].pos[0]*(cell+gap)+cell/2+2, cy = k => A[k].pos[1]*(ch+gap)+ch/2+2;
  let lines="", boxes="";
  ids.forEach(k=>{
    Object.values(A[k].exits).forEach(t=>{ if(k<t) lines+=`<line x1="${cx(k)}" y1="${cy(k)}" x2="${cx(t)}" y2="${cy(t)}" stroke="#173A5E" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>`; });
    A[k].doors.forEach(t=>{ if(k<t) lines+=`<line x1="${cx(k)}" y1="${cy(k)}" x2="${cx(t)}" y2="${cy(t)}" stroke="#173A5E" stroke-width="2.5" stroke-dasharray="1 4" stroke-linecap="round" opacity=".6"/>`; });
  });
  const hint = $("map").dataset.hint;
  ids.forEach(k=>{
    const here = k===curArea(), seen = vis.has(k);
    boxes += `<rect x="${cx(k)-cell/2}" y="${cy(k)-ch/2}" width="${cell}" height="${ch}" rx="4"
      fill="${k===hint?"#FF6FA6":here?"#FFCB2F":seen?"#8FD0FF":"#EAF6FF"}" stroke="#173A5E" stroke-width="${here||k===hint?2.5:1.6}" ${k===hint?'class="pulse"':""}/>`;
    if(!seen && !here && k!==hint) boxes += `<text x="${cx(k)}" y="${cy(k)+4}" text-anchor="middle" font-size="10" font-weight="900" fill="#9DB7D2" font-family="Grandstander,sans-serif">?</text>`;
  });
  const wpx = cols*(cell+gap)-gap+4, hpx = rows*(ch+gap)-gap+4;
  $("map").innerHTML = `<svg viewBox="0 0 ${wpx} ${hpx}" width="${Math.round(wpx*1.1)}" height="${Math.round(hpx*1.1)}">${lines}${boxes}</svg>`;
}
function renderArrows(){
  const a = W().areas[curArea()];
  ["up","down","left","right"].forEach(d=>{ const to = a.exits[d]; $(d).hidden = !to; if(to){ $(d).dataset.to = W().areas[to].name; $(d).setAttribute("aria-label", `Go to ${W().areas[to].name}`);} });
}
function renderTop(){

  const f = F(); $("inv").innerHTML = (f.key && !f.chest) ? `<span class="chip"><svg width="28" height="18" viewBox="-12 -10 48 20" aria-hidden="true"><path d="M5 -3 H32 V3 H28 V8 H24 V3 H5 Z" fill="#FFCB2F" stroke="#173A5E" stroke-width="2.2" stroke-linejoin="round"/><circle r="8" fill="#FFCB2F" stroke="#173A5E" stroke-width="2.2"/><circle r="3" fill="#fff" stroke="#173A5E" stroke-width="1.6"/></svg>Key</span>` : "";
}
function renderLog(newId){

      <span class="tier t-${d.tier}">${d.tier==="Legendary"?"✦ ":""}${d.tier}</span><b>${d.name}</b></div>`;

      <span class="tier t-${d.tier}">${d.tier}</span><span class="hint">${d.hint}</span></div>`;

}

/* ---------- Moving around ---------- */
let busy = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function showArea(kind){
  const stage = $("stage"), olds = [...stage.querySelectorAll(".layer")];
  const layer = document.createElement("div"); layer.className="layer"; layer.innerHTML = sceneSVG();
  stage.insertBefore(layer, stage.firstChild);
  const vis = S.visited[W().id]; if(!vis.includes(curArea())) vis.push(curArea());
  $("map").dataset.hint = ""; renderMap(); renderArrows(); renderTop(); save();
  if(!olds.length) return;
  if(reduce || !kind || !layer.animate){ olds.forEach(o=>o.remove()); return; }
  busy = true;
  const old = olds[0]; olds.slice(1).forEach(o=>o.remove());
  const dirs = {left:[-1,0], right:[1,0], up:[0,-1], down:[0,1]};
  let a, b;
  if(kind==="door"){ a=[{transform:"scale(1)",opacity:1},{transform:"scale(1.25)",opacity:0}]; b=[{transform:"scale(.85)",opacity:0},{transform:"scale(1)",opacity:1}]; }
  else { const [dx,dy]=dirs[kind]; a=[{transform:"none"},{transform:`translate(${-dx*100}%,${-dy*100}%)`}]; b=[{transform:`translate(${dx*100}%,${dy*100}%)`},{transform:"none"}]; }
  const opt = {duration:320, easing:"cubic-bezier(.3,.7,.2,1)"};
  const done = ()=>{ old.remove(); busy=false; };
  old.animate(a,opt); const an = layer.animate(b,opt); an.onfinish = done; setTimeout(()=>{ if(busy) done(); }, 700);
}
const layerEl = () => $("stage").querySelector(".layer");
function move(dir){ if(busy || !$("done").hidden) return; const to = W().areas[curArea()].exits[dir]; if(!to) return; S.area[W().id]=to; blip(dir); showArea(dir); }
function enterDoor(to){ if(busy) return; S.area[W().id]=to; blip("door"); showArea("door"); }
["up","down","left","right"].forEach(d => $(d).addEventListener("click", ()=>move(d)));
addEventListener("keydown", e=>{
  if($("play").hidden) return;
  const k = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"}[e.key];
  if(k && !e.target.closest(".duck,.act,.door")){ e.preventDefault(); move(k); }
});

/* ---------- Sound ---------- */
let actx=null;
function ctx(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }catch(e){ return null; } }
function tone(f1,f2,dur,type="sine",vol=.18,when=0){
  if(!S.sound) return; const c=ctx(); if(!c) return;
  try{ const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    fl.type="lowpass"; fl.frequency.value=1600; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}
const quack = ()=>{ tone(560,260,.18,"sawtooth",.25); tone(520,250,.16,"sawtooth",.18,.2); };
const blip = (k)=> tone(k==="door"?300:420, k==="door"?200:520, .08, "triangle", .08);
const pop = ()=> tone(300,700,.12,"sine",.15);
const fanfare = ()=> [523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,.22,"triangle",.16,i*.13));
function setSoundBtn(){ $("soundBtn").innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5.5-4.5v15L7.5 15h-4z" fill="#FFCB2F" stroke="#173A5E" stroke-width="2.2" stroke-linejoin="round"/>${S.sound?'<path d="M16 8.5q3 3.5 0 7M18.5 6q5 6 0 12" stroke="#173A5E" stroke-width="2.4" stroke-linecap="round" fill="none"/>':'<path d="M16.5 9l5 6M21.5 9l-5 6" stroke="#173A5E" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;
  $("soundBtn").setAttribute("aria-pressed", String(S.sound)); $("soundBtn").setAttribute("aria-label", S.sound?"Sound on":"Sound off"); }
$("soundBtn").addEventListener("click", ()=>{ S.sound=!S.sound; save(); setSoundBtn(); });

/* ---------- Finding ducks ---------- */
let toastTimer;
function toast(msg, ms=1800, kind=""){ if(!msg) return; const t=$("toast"); t.textContent=msg; t.className="toast "+kind; void t.offsetWidth; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),ms); }
function burst(x,y,colors){
  if(reduce) return; const stage=$("stage");
  for(let i=0;i<14;i++){ const p=document.createElement("div"); p.className="fx dot"; p.style.left=x+"px"; p.style.top=y+"px"; p.style.background=colors[i%colors.length]; stage.appendChild(p);
    const a=i/14*Math.PI*2, r=40+Math.random()*40;
    if(p.animate) p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`,opacity:0}],{duration:650,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>p.remove(); else p.remove(); }
  const plus=document.createElement("div"); plus.className="fx plus"; plus.textContent="+1"; plus.style.left=x+"px"; plus.style.top=y+"px"; stage.appendChild(plus);
  if(plus.animate) plus.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:"translate(-50%,-160%)",opacity:0}],{duration:900,easing:"ease-out"}).onfinish=()=>plus.remove(); else plus.remove();
}
function catchDuck(el){
  const id = el.dataset.duck; if(found.has(id)) return;
  found.add(id); S.found.push(id); save();
  const sr=$("stage").getBoundingClientRect(), r=el.getBoundingClientRect();
  burst(r.left+r.width/2-sr.left, r.top+r.height/2-sr.top, [DUCK[id].c.body,"#fff","#FFCB2F","#FF6FA6"]);
  quack();
  el.style.pointerEvents="none";
  if(el.animate && !reduce){ const tf = el.getAttribute("transform"); el.removeAttribute("transform"); el.style.transformBox="view-box";
    el.animate([{transform:css(tf)+" scale(1)"},{transform:css(tf)+" scale(1.5)",opacity:1},{transform:css(tf)+" scale(0)",opacity:0}],{duration:380,fill:"forwards"}); }
  toast(`Quack! ${DUCK[id].name} found!`, 1900, "found");
  $("count").classList.remove("bump"); void $("count").offsetWidth; $("count").classList.add("bump");
  renderLog(id); renderTop();
  setTimeout(()=>{ const l=layerEl(); if(l) l.innerHTML=sceneSVG(); if(worldDone(S.world) && $("done").hidden) worldComplete(); }, 420);
}
const css = tf => tf.replace(/translate\(([-\d.]+) ([-\d.]+)\)/,"translate($1px,$2px)").replace(/scale\(([-\d.]+) ([-\d.]+)\)/,"scale($1,$2)");
function worldComplete(){
  const last = S.world === WORLDS.length-1;
  if(!last) S.unlocked = Math.max(S.unlocked, S.world+2); save();
  fanfare();
  const total = allDucks.length, all = allDucks.every(d=>found.has(d.id));
  const hero = `<svg viewBox="0 0 120 100" aria-hidden="true">${mascot({eye:"happy", hat: all ? "crown" : "boat"})}</svg>`;
  let html;
  if(all) html = `${hero}<h3>Every duck found!</h3><p>All ${total} ducks are in your Duck Log. Mitchell is dreaming up more worlds.</p><div class="row"><button class="btn" id="doneBtn" type="button">Back to worlds</button></div>`;
  else if(last) html = `${hero}<h3>Duck Log full!</h3><p>${W().name} is all yours. A few ducks are still hiding in other worlds.</p><div class="row"><button class="btn" id="doneBtn" type="button">Back to worlds</button></div>`;
  else html = `${hero}<h3>Duck Log full!</h3><p>${W().name} is all yours. Next stop: ${WORLDS[S.world+1].name}.</p><div class="row"><button class="btn go" id="doneBtn" type="button">Next world</button><button class="btn alt" id="doneHome" type="button">Worlds</button></div>`;
  $("doneBody").innerHTML = html;
  $("done").hidden = false;
  const sr=$("stage").getBoundingClientRect(); for(let k=0;k<3;k++) setTimeout(()=>burst(sr.width*(.25+k*.25), sr.height*.3, ["#FFCB2F","#3FB86A","#FF6FA6","#8FD0FF"]), k*180);
  const nextWorld = last || all ? null : S.world+1;
  $("doneBtn").addEventListener("click", ()=>{ $("done").hidden=true; if(nextWorld===null) goHome(); else openWorld(nextWorld); });
  if($("doneHome")) $("doneHome").addEventListener("click", ()=>{ $("done").hidden=true; goHome(); });
}
function onStageTap(e){
  if(busy || !$("done").hidden) return;
  const d = e.target.closest(".duck"); if(d){ catchDuck(d); return; }
  const a = e.target.closest(".act");
  if(a){ const msg = ACTS[a.dataset.act](F()); pop(); toast(msg); save(); layerEl().innerHTML = sceneSVG(); renderTop(); return; }
  const g = e.target.closest(".door"); if(g) enterDoor(g.dataset.go);
}
$("stage").addEventListener("click", onStageTap);
$("stage").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.closest(".duck,.act,.door")){ e.preventDefault(); onStageTap(e); } });

$("hintBtn").addEventListener("click", ()=>{
  const left = W().ducks.filter(d=>!found.has(d.id));
  if(!left.length){ toast("Every duck here is found!"); return; }
  const d = left.find(x=>x.area===curArea()) || left[0]; const where = W().areas[d.area].name;
  toast(d.area===curArea() ? `A duck is right here. ${d.hint}...` : `Psst... try the ${where}.`, 2600);
  $("map").dataset.hint = d.area; renderMap();
});

/* ---------- Screens ---------- */
function openWorld(i){
  S.world = i; save();
  $("home").hidden = true; $("play").hidden = false; $("done").hidden = true;
  $("stage").querySelectorAll(".layer").forEach(l=>l.remove());
  busy = false;
  renderLog(); showArea(null);
  $("play").classList.remove("screen-in"); void $("play").offsetWidth; $("play").classList.add("screen-in");
  if(worldDone(i)) toast("Every duck here is found. Explore away!", 2200);
}
function goHome(){ renderHome(); $("play").hidden = true; $("home").hidden = false; $("home").classList.remove("screen-in"); void $("home").offsetWidth; $("home").classList.add("screen-in"); scrollTo(0,0); }
$("startBtn").addEventListener("click", ()=>{ pop(); openWorld(+$("startBtn").dataset.world || 0); });
$("homeBtn").addEventListener("click", goHome);
$("worlds").addEventListener("click", e=>{ const b=e.target.closest(".wcard"); if(b && !b.disabled){ pop(); openWorld(+b.dataset.world); } });
$("reset").addEventListener("click", ()=>{
  const b=$("reset");
  if(b.dataset.sure){ S=fresh(); syncFound(); save(); delete b.dataset.sure; b.textContent="Start over"; renderHome(); }
  else { b.dataset.sure="1"; b.textContent="Tap again to erase every duck"; setTimeout(()=>{ delete b.dataset.sure; b.textContent="Start over"; },4000); }
});

/* Test hook (used only by automated checks) */
window.QUACKERS = { WORLDS, get state(){ return S; }, openWorld, go:(a)=>{ S.area[W().id]=a; showArea(null); } };

load(); syncFound(); setSoundBtn(); renderHome();
</script>
</body>
